<!doctype html>
<html lang="en">
  <head>
    <!-- Standard metadata for character encoding and responsive layout -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Sign Up • CareerConnect</title>

    <!-- Shared styles: base reset, reusable components, then page layout -->
    <link rel="stylesheet" href="../../css/styles.css" />
  </head>

  <body>
    <!-- Header: brand + quick navigation to log in -->
    <header>
      <div class="container">
        <a href="../index/index.html" class="site-logo">CareerConnect</a>
        <nav>
          <a href="./login.html" class="action-button">Log In</a>
        </nav>
      </div>
    </header>

    <!-- Main: hero shell reused from landing page, with auth card content -->
    <main>
      <section class="hero">
        <!-- Decorative background layer shown behind auth content -->
        <div class="grid-wrapper">
          <div class="grid-background"></div>
        </div>

        <!-- Foreground content container -->
        <div class="container">
          <!-- Sign-up panel/card -->
          <div class="auth-panel">
            <h1>Sign Up</h1>
            <p class="auth-subtext">
              Create your account to start connecting with your future career opportunities.
            </p>

            <!-- Hidden error box toggled by form validation/auth logic -->
            <div class="auth-error" id="errorBox" hidden>
              Please review the highlighted fields.
            </div>

            <!-- Sign-up form with browser validation hints -->
            <form id="signupForm" class="auth-form" novalidate>
              <!-- Full name -->
              <label class="auth-field">
                <span>Full Name</span>
                <input
                  id="fullName"
                  class="auth-input"
                  type="text"
                  name="fullName"
                  placeholder="Jane Doe"
                  autocomplete="name"
                  required
                />
                <small id="nameHint" hidden>Please enter your full name.</small>
              </label>

              <!-- Email -->
              <label class="auth-field">
                <span>Email</span>
                <input
                  id="email"
                  class="auth-input"
                  type="email"
                  name="email"
                  placeholder="name@example.com"
                  autocomplete="email"
                  required
                />
                <small id="emailHint" hidden>Please enter a valid email.</small>
              </label>

              <!-- Password -->
              <label class="auth-field">
                <span>Password</span>
                <input
                  id="password"
                  class="auth-input"
                  type="password"
                  name="password"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
                <small id="passHint" hidden
                  >Password must be at least 8 characters.</small
                >
              </label>

              <!-- Password confirmation -->
              <label class="auth-field">
                <span>Confirm Password</span>
                <input
                  id="confirmPassword"
                  class="auth-input"
                  type="password"
                  name="confirmPassword"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  minlength="6"
                  required
                />
                <small id="confirmHint" hidden>Passwords must match.</small>
              </label>

                <div>
                  <label >
                    <input type="radio" name="role" value="seeker" checked /> Job Seeker
                  </label>
                  <label >
                    <input type="radio" name="role" value="recruiter"  /> Recruiter
                  </label>
                </div>

                <!-- hidden by default, shown only when admin is selected -->
                <div id="recruiterField" hidden>
                  <input type="password" id="companyKey" placeholder="Company Secret Key" class="auth-input" />
                </div>

              <!-- Primary action button -->
              <button class="action-button action-button--full" type="submit">
                Create Account
              </button>
            </form>

            <!-- Secondary navigation for existing users -->
            <p class="auth-subtext auth-subtext--small">
              Already have an account? <a href="./login.html">Log in</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer: project attribution -->
    <footer>
      <div class="container">
        <p>&copy; 2026 • SOEN 341 • Concordia University</p>
      </div>
    </footer>
    <script>
      // Toggle visibility of the recruiter field based on the selected role
    document.querySelectorAll('input[name="role"]').forEach((radio) => {
    radio.addEventListener('change', (e) => {
      const recruiterField = document.getElementById('recruiterField');
      recruiterField.hidden = e.target.value !== 'recruiter';
    });
  });
</script>
  </body>
</html>
